services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-focustask}
      POSTGRES_USER: ${POSTGRES_USER:-focustask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - focustask-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    mem_limit: 512m
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      FOCUSTASK_JWT_SECRET: ${FOCUSTASK_JWT_SECRET:?Set a random JWT secret of at least 32 bytes in .env}
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-focustask}
      DB_USERNAME: ${POSTGRES_USER:-focustask}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  focustask-postgres:
