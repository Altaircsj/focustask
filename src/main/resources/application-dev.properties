# MySQL local: preserve the existing environment variable contract.
spring.datasource.url=${FOCUSTASK_DB_URL}
spring.datasource.username=${FOCUSTASK_DB_USERNAME}
spring.datasource.password=${FOCUSTASK_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.locations=classpath:db/migration/mysql
spring.jpa.show-sql=${FOCUSTASK_SHOW_SQL:false}
