spring.application.name=focustask
spring.datasource.url=${FOCUSTASK_DB_URL}
spring.datasource.username=${FOCUSTASK_DB_USERNAME}
spring.datasource.password=${FOCUSTASK_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=false
